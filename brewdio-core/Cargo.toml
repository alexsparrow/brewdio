[package]
name = "brewdio-core"
version = "0.2.1" # x-release-please-version
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "tsify"]
crdt = ["automerge", "autosurgeon"]

[build-dependencies]
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking"] }
tar = "0.4"
flate2 = "1.0"
serde_json = "1.0"
schemars = "0.8"
typify = "0.2"
prettyplease = "0.2"
syn = "2.0"
quote = "1.0"

[dependencies]
regress = "0.10.5"
tsify = { version = "0.5.6", features = ["js"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
automerge = { version = "0.7", optional = true }
autosurgeon = { version = "0.10", optional = true }
