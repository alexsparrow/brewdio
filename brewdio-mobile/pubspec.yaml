name: brewdio_mobile
description: Brewdio - Homebrewing recipe manager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_rust_bridge: ^2.11.1
  flutter_riverpod: ^3.2.1
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  rust_builder:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
