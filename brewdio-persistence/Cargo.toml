[package]
name = "brewdio-persistence"
version = "0.2.6" # x-release-please-version
edition = "2021"

[features]
default = ["native"]
native = ["rusqlite/bundled", "tokio"]
wasm = ["sqlite-wasm-rs", "wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-time", "getrandom", "wasmtimer"]

[dependencies]
# Always (pure, WASM-safe)
brewdio-core = { path = "../brewdio-core", features = ["crdt"] }
automerge = "0.7"
autosurgeon = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
rand = "0.9"
log = "0.4"

# Cross-platform sync
tokio-tungstenite-wasm = "0.8"
futures-util = "0.3"

# Native only
rusqlite = { version = "0.34", features = ["bundled"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }

# WASM only
sqlite-wasm-rs = { version = "0.3", default-features = false, features = ["precompiled"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-time = { version = "1", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
wasmtimer = { version = "0.4", optional = true }
