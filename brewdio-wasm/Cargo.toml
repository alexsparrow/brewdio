[package]
name = "brewdio-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
brewdio-core = { path = "../brewdio-core", features = ["wasm", "crdt"] }
brewdio-persistence = { path = "../brewdio-persistence", default-features = false, features = ["wasm"] }
serde = "1.0.228"
serde_json = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
