[package]
name = "brewdio-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
core = { path = "../core", features = ["wasm", "crdt"] }
persistence = { path = "../persistence", default-features = false, features = ["wasm"] }
serde = "1.0.228"
serde_json = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]
