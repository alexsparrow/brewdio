[package]
name = "brewdio-wasm"
version = "0.5.0" # x-release-please-version
edition = "2024"

[dependencies]
brewdio-core = { path = "../brewdio-core", features = ["wasm", "crdt"] }
brewdio-persistence = { path = "../brewdio-persistence", default-features = false, features = ["wasm"] }
serde = "1.0.228"
serde_json = "1"
tsify = { version = "0.5.6", features = ["js"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
futures-util = "0.3"
wasmtimer = "0.4"
console_log = "1"
log = "0.4"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

[lib]
crate-type = ["cdylib", "rlib"]
