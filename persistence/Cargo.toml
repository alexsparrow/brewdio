[package]
name = "persistence"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = ["rusqlite/bundled", "tokio", "tokio-tungstenite", "futures-util"]
wasm = ["sqlite-wasm-rs", "wasm-bindgen", "wasm-bindgen-futures", "js-sys", "getrandom"]

[dependencies]
# Always (pure, WASM-safe)
brewdio-core = { package = "core", path = "../core", features = ["crdt"] }
automerge = "0.7"
autosurgeon = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }

# Native only
rusqlite = { version = "0.34", features = ["bundled"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.26", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }

# WASM only
sqlite-wasm-rs = { version = "0.3", default-features = false, features = ["precompiled"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
